<!doctype html>
<html lang="{{LANG}}" data-theme="{{THEME}}" data-density="{{DENSITY}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="{{COLOR_SCHEME}}">
  <meta name="design-system" content="AI-Shifu Learning Report · Studio">
  <link rel="icon" href="data:,">
  <title>{{COURSE_TITLE}} · {{TITLE_SUFFIX}}</title>
  <style>
    /* ------------------------------------------------------------------
       Tokens. The default (`shifu`) theme is the AI-Shifu brand: brand blue
       #0F63EE, white surfaces, light-blue panels, slate ink. Other themes
       override tokens. `--accent` is injected by the renderer after a
       contrast check against the theme surface.
       ------------------------------------------------------------------ */
    :root {
      --accent: {{ACCENT_COLOR}};
      --canvas: #f3f6fb;
      --surface: #ffffff;
      --surface-2: #f6f9fe;
      --ink: #0f172a;
      --ink-soft: #475569;
      --muted: #64748b;
      --line: #dce5f2;
      --line-strong: #b9c7dc;
      --good: #17703a;
      --watch: #8a5a00;
      --attention: #b3261e;
      --good-bg: #e8f4ec;
      --watch-bg: #fbf1dc;
      --attention-bg: #fbe9e7;
      --neutral-bg: #eef2f8;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-mark: 4px;
      --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 28px rgba(15, 99, 238, .06);
      --rule: 1px;
      --accent-soft: #eff5ff;
      --accent-soft: color-mix(in srgb, var(--accent) 8%, var(--surface));
      --track: #d6e4fc;
      --track: color-mix(in srgb, var(--accent) 16%, var(--surface));
      --cover-glow: radial-gradient(circle at 100% 0, var(--track), transparent 58%);
      --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    html[data-theme="paper"] {
      --canvas: #f4f1ea;
      --surface-2: #faf8f3;
      --ink: #1c1a17;
      --ink-soft: #55514a;
      --muted: #6f6b62;
      --line: #e7e2d6;
      --line-strong: #cfc8b8;
      --neutral-bg: #f0eee8;
      --shadow: 0 1px 2px rgba(28, 26, 23, .04), 0 10px 28px rgba(28, 26, 23, .05);
    }

    html[data-theme="swiss"] {
      --canvas: #efefeb;
      --surface-2: #f7f7f4;
      --ink: #111111;
      --ink-soft: #444444;
      --muted: #666666;
      --line: #cecec8;
      --line-strong: #111111;
      --neutral-bg: #efefeb;
      --radius: 0px;
      --radius-sm: 0px;
      --radius-mark: 0px;
      --shadow: none;
      --rule: 2px;
      --cover-glow: none;
      --font: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei", sans-serif;
    }

    html[data-theme="forest"] {
      --canvas: #eef3ec;
      --surface-2: #f6f9f4;
      --ink: #16211b;
      --ink-soft: #48564d;
      --muted: #647067;
      --line: #dde6da;
      --line-strong: #bccbb9;
      --neutral-bg: #eaf0e8;
    }

    html[data-theme="night"] {
      color-scheme: dark;
      --canvas: #0f1115;
      --surface: #181b21;
      --surface-2: #1f232b;
      --ink: #eceae4;
      --ink-soft: #bdb9af;
      --muted: #96928a;
      --line: #2b303a;
      --line-strong: #3c4350;
      --good: #6fd69a;
      --watch: #f1bb55;
      --attention: #ff8f85;
      --good-bg: #17301f;
      --watch-bg: #33290f;
      --attention-bg: #3a1b18;
      --neutral-bg: #252a33;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    html[data-density="compact"] { font-size: 14.5px; line-height: 1.5; }

    body { margin: 0; }
    a { color: inherit; }
    p { margin: 0; }
    h1, h2, h3, h4 { margin: 0; color: var(--ink); line-height: 1.25; }

    .skip-link {
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 12px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: var(--ink);
      color: var(--surface);
      transform: translateY(-200%);
    }

    .skip-link:focus { transform: translateY(0); }

    /* ---------- Page frame ---------- */
    .page {
      display: grid;
      grid-template-columns: 188px minmax(0, 1fr);
      gap: 2rem;
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 2rem 1.5rem 4.5rem;
    }

    .toc {
      position: sticky;
      top: 2rem;
      align-self: start;
      max-height: calc(100vh - 4rem);
      overflow-y: auto;
      font-size: .84rem;
    }

    .toc-title {
      margin-bottom: .75rem;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .toc ol { margin: 0; padding: 0; list-style: none; }

    .toc a {
      display: flex;
      gap: .6rem;
      padding: .42rem .6rem;
      border-radius: var(--radius-sm);
      color: var(--ink-soft);
      text-decoration: none;
    }

    .toc a:hover, .toc a:focus-visible { background: var(--surface); color: var(--ink); }
    .toc-index { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600; }

    .report { display: grid; gap: 1.5rem; min-width: 0; }
    main { display: grid; gap: 1.5rem; min-width: 0; }
    .report > *, main > * { min-width: 0; }

    /* ---------- Cover ---------- */
    .cover, .section {
      border: var(--rule) solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    html[data-theme="swiss"] .cover,
    html[data-theme="swiss"] .section { border-color: var(--line-strong); border-width: 2px 0 0; }

    .cover {
      position: relative;
      overflow: hidden;
      padding: 2rem 2.5rem 2.25rem;
      background-image: var(--cover-glow);
    }

    html[data-theme="swiss"] .cover { border-top: 12px solid var(--accent); }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--ink-soft);
      font-size: .82rem;
      font-weight: 600;
    }

    .brand-lockup { display: flex; align-items: center; gap: .75rem; }
    .brand-logo { display: block; width: auto; height: 30px; }
    .brand-logo.on-dark { display: none; }
    .brand-divider { color: var(--line-strong); }

    .report-kind {
      padding: .2rem .7rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: .74rem;
      white-space: nowrap;
    }

    html[data-theme="swiss"] .report-kind { border-radius: 0; }

    .cover h1 {
      max-width: 22em;
      margin: 3.25rem 0 .75rem;
      font-size: clamp(2rem, 4.6vw, 3.25rem);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -.02em;
    }

    .cover-subtitle { max-width: 44em; color: var(--ink-soft); font-size: 1.05rem; }

    .cover-meta {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem 1.75rem;
      margin-top: 2rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--line);
      color: var(--ink-soft);
      font-size: .8rem;
    }

    .cover-meta span { display: inline-flex; gap: .4rem; }
    .cover-meta strong { color: var(--muted); font-weight: 500; }

    /* Brand cover: a solid accent plane with the reversed logo. */
    html[data-theme="shifu"] .cover {
      border-color: transparent;
      background-color: var(--accent);
      background-image: radial-gradient(circle at 100% 0, rgba(255, 255, 255, .2), transparent 56%);
      color: #ffffff;
    }

    html[data-theme="shifu"] .cover h1 { color: #ffffff; }

    html[data-theme="shifu"] .cover .brand-row,
    html[data-theme="shifu"] .cover .cover-subtitle,
    html[data-theme="shifu"] .cover .cover-meta { color: rgba(255, 255, 255, .92); }

    html[data-theme="shifu"] .cover .cover-meta strong,
    html[data-theme="shifu"] .cover .brand-divider { color: rgba(255, 255, 255, .7); }

    html[data-theme="shifu"] .cover .cover-meta { border-top-color: rgba(255, 255, 255, .28); }
    html[data-theme="shifu"] .cover .report-kind { border-color: rgba(255, 255, 255, .55); color: #ffffff; }

    html[data-theme="shifu"] .brand-logo.on-light,
    html[data-theme="night"] .brand-logo.on-light { display: none; }

    html[data-theme="shifu"] .brand-logo.on-dark,
    html[data-theme="night"] .brand-logo.on-dark { display: block; }

    /* ---------- Sections ---------- */
    .section { padding: 2rem 2.5rem 2.5rem; scroll-margin-top: 1.5rem; }

    .section-heading { max-width: 46em; margin-bottom: 1.75rem; }

    .section-eyebrow {
      display: inline-flex;
      align-items: baseline;
      gap: .55rem;
      margin-bottom: .55rem;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .06em;
    }

    .section-index { font-variant-numeric: tabular-nums; }

    h2 { font-size: clamp(1.4rem, 2.4vw, 1.8rem); font-weight: 700; letter-spacing: -.01em; }
    h3 { font-size: 1.02rem; font-weight: 650; }
    h4 { font-size: .9rem; font-weight: 650; }

    .section-description { margin-top: .5rem; color: var(--ink-soft); font-size: .92rem; }

    .subsection-heading {
      margin: 2rem 0 .9rem;
      color: var(--ink-soft);
      font-size: .82rem;
      font-weight: 650;
      letter-spacing: .04em;
    }

    /* ---------- Summary ---------- */
    .verdict {
      padding: .2rem 0 .2rem 1.1rem;
      border-left: 4px solid var(--accent);
      font-size: clamp(1.15rem, 2vw, 1.45rem);
      font-weight: 650;
      line-height: 1.4;
    }

    .verdict-label {
      display: block;
      margin-bottom: .25rem;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 600;
      letter-spacing: .06em;
    }

    .conclusions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin: 1.5rem 0 0;
      padding: 0;
      list-style: none;
    }

    .conclusion {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .8rem;
      padding: 1.1rem 1.2rem;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      font-size: .95rem;
    }

    .badge-index {
      display: grid;
      width: 1.7rem;
      height: 1.7rem;
      place-items: center;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .82rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    html[data-theme="swiss"] .badge-index { border-radius: 0; }

    .callout {
      margin-top: 1.25rem;
      padding: .9rem 1.1rem;
      border: 1px solid var(--line);
      border-left: 4px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--ink-soft);
      font-size: .86rem;
    }

    .callout strong { color: var(--ink); }
    .callout.is-limit { border-left-color: var(--watch); }
    .callout.is-privacy { border-left-color: var(--good); }
    .callout ul { margin: .35rem 0 0; padding-left: 1.2rem; }
    .empty-state { margin-top: 0; color: var(--muted); }

    /* ---------- Metric tiles ---------- */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
    }

    .kpi {
      display: flex;
      flex-direction: column;
      gap: .45rem;
      padding: 1.15rem 1.25rem 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }

    .kpi-label { color: var(--ink-soft); font-size: .84rem; font-weight: 600; }

    .kpi-value {
      display: flex;
      align-items: baseline;
      gap: .2rem;
      font-size: clamp(2rem, 3.4vw, 2.6rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -.02em;
    }

    .kpi-value .unit { color: var(--ink-soft); font-size: .42em; font-weight: 600; letter-spacing: 0; }
    .kpi-value.is-empty { color: var(--muted); font-size: 1.05rem; font-weight: 600; letter-spacing: 0; line-height: 2.4; }
    .kpi-fraction, .kpi-delta { color: var(--ink-soft); font-size: .78rem; }
    .kpi-meta { margin-top: auto; padding-top: .35rem; color: var(--muted); font-size: .74rem; }

    .tag {
      display: inline-block;
      margin-left: .4rem;
      padding: .05rem .45rem;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: 0;
      vertical-align: middle;
      white-space: nowrap;
    }

    .tag.is-teacher { border-color: var(--accent); color: var(--accent); }
    html[data-theme="swiss"] .tag { border-radius: 0; }

    /* ---------- Marks ---------- */
    .meter {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }

    .meter > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
    html[data-theme="swiss"] .meter, html[data-theme="swiss"] .meter > span { border-radius: 0; }

    .bar { height: 14px; border-left: 1px solid var(--line-strong); }

    .bar > span {
      display: block;
      min-width: 2px;
      height: 100%;
      border-radius: 0 var(--radius-mark) var(--radius-mark) 0;
      background: var(--accent);
    }

    .chart { margin: 0; }
    .chart-caption { margin-bottom: 1rem; color: var(--muted); font-size: .78rem; }
    .chart-title { margin-bottom: .3rem; }

    .path { display: grid; gap: 1.05rem; margin: 0; padding: 0; list-style: none; }

    .path-row {
      display: grid;
      grid-template-columns: minmax(150px, 1.1fr) minmax(160px, 2.4fr) minmax(84px, auto);
      align-items: center;
      gap: .3rem 1.1rem;
    }

    .path-stage { display: flex; align-items: baseline; gap: .6rem; font-size: .92rem; font-weight: 600; }
    .path-index { color: var(--muted); font-size: .76rem; font-variant-numeric: tabular-nums; font-weight: 600; }
    .path-value { font-size: .95rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .path-note { grid-column: 2 / -1; color: var(--muted); font-size: .76rem; }

    /* ---------- Tables ---------- */
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
    table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    caption { padding: .8rem 1rem 0; color: var(--ink-soft); font-size: .8rem; font-weight: 600; text-align: left; }
    th, td { padding: .7rem 1rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    tbody tr:last-child > * { border-bottom: 0; }
    thead th { background: var(--surface-2); color: var(--ink-soft); font-size: .76rem; font-weight: 600; white-space: nowrap; }
    tbody th { min-width: 10em; font-weight: 600; }
    .lesson-table td { white-space: nowrap; }
    td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .cell-sub { display: block; color: var(--muted); font-size: .74rem; font-weight: 500; }
    .is-missing { color: var(--muted); }

    /* ---------- Pills ---------- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      padding: .12rem .6rem;
      border-radius: 999px;
      background: var(--neutral-bg);
      color: var(--ink-soft);
      font-size: .74rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: currentColor; }
    .pill.is-plain::before { content: none; }
    .pill.is-healthy { background: var(--good-bg); color: var(--good); }
    .pill.is-watch { background: var(--watch-bg); color: var(--watch); }
    .pill.is-attention { background: var(--attention-bg); color: var(--attention); }
    .pill.prio-high { background: var(--accent-soft); color: var(--accent); }
    html[data-theme="swiss"] .pill, html[data-theme="swiss"] .pill::before { border-radius: 0; }

    /* ---------- Lessons ---------- */
    .lesson-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; }

    .lesson, .rec, .note-card, .dimension, .theme {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
    }

    .lesson { display: flex; flex-direction: column; gap: .9rem; padding: 1.2rem 1.25rem 1rem; }
    .lesson-header { display: flex; align-items: flex-start; justify-content: space-between; gap: .9rem; }
    .lesson-order { display: block; margin-bottom: .2rem; color: var(--accent); font-size: .74rem; font-weight: 700; letter-spacing: .04em; }
    .lesson-finding { color: var(--ink-soft); font-size: .9rem; }

    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: .5rem; margin: 0; }
    .stat { padding: .55rem .7rem; border-radius: calc(var(--radius-sm) - 2px); background: var(--surface-2); }
    .stat dt { color: var(--muted); font-size: .72rem; }
    .stat dd { margin: .1rem 0 0; font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    .evidence { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; color: var(--muted); font-size: .76rem; }

    .evidence-ref {
      padding: .12rem .55rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: .74rem;
    }

    html[data-theme="swiss"] .evidence-ref { border-radius: 0; }

    /* ---------- Follow-up themes ---------- */
    .theme-list { display: grid; gap: .8rem; margin: 0; padding: 0; list-style: none; }
    .theme { display: grid; grid-template-columns: minmax(0, 1fr) minmax(140px, 240px); gap: .5rem 1.5rem; padding: 1.1rem 1.25rem; }
    .theme-intent { margin-top: .3rem; color: var(--ink-soft); font-size: .9rem; }
    .theme-lessons { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; }
    .theme-share { align-self: center; }
    .theme-count { display: block; margin-bottom: .35rem; font-size: .86rem; font-weight: 700; font-variant-numeric: tabular-nums; }

    /* ---------- Metric rows ---------- */
    .note-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .note-card { padding: 1.2rem 1.25rem 1rem; }
    .note-card > h3 { margin-bottom: .8rem; }
    .note-card ul { margin: 0; padding-left: 1.2rem; color: var(--ink-soft); font-size: .88rem; }
    .note-card li + li { margin-top: .35rem; }

    .metric-list { display: grid; margin: 0; }
    .metric-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem 1rem; align-items: baseline; padding: .65rem 0; border-top: 1px solid var(--line); }
    .metric-row:first-child { border-top: 0; padding-top: 0; }
    .metric-row dt { font-size: .88rem; }
    .metric-row dd { margin: 0; font-size: .98rem; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
    .metric-context { display: block; color: var(--muted); font-size: .72rem; }
    .metric-row .meter, .metric-row .bar { grid-column: 1 / -1; margin-top: .25rem; }
    .metric-row .bar { height: 8px; }

    /* ---------- Audience ---------- */
    .dimension { padding: 1.2rem 1.25rem; }
    .dimension + .dimension { margin-top: 1rem; }
    .dimension > h3 { margin-bottom: .9rem; }
    .seg-list { display: grid; gap: .6rem; margin: 0; padding: 0; list-style: none; }
    .seg-row { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(140px, 2fr) minmax(96px, auto); align-items: center; gap: 1rem; font-size: .88rem; }
    .seg-value { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; white-space: nowrap; }
    .implication { margin-top: 1rem; padding-top: .85rem; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: .88rem; }
    .implication strong { color: var(--ink); }

    /* ---------- Recommendations ---------- */
    .rec-list { display: grid; gap: 1rem; }
    .rec { padding: 1.35rem 1.4rem 1.15rem; }
    .rec-header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: .8rem; }
    .rec-header h3 { padding-top: .12rem; font-size: 1.08rem; }
    .rec-pills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .4rem; }

    .rec-action {
      margin: 1rem 0;
      padding: .9rem 1.1rem;
      border-radius: calc(var(--radius-sm) - 2px);
      background: var(--accent-soft);
      font-size: .95rem;
    }

    .rec-label { display: block; margin-bottom: .2rem; color: var(--muted); font-size: .74rem; font-weight: 650; letter-spacing: .04em; }
    .rec-action .rec-label { color: var(--accent); }
    .rec-body { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem 1.5rem; margin: 0 0 1rem; }
    .rec-body dt { margin: 0; }
    .rec-body dd { margin: 0; color: var(--ink-soft); font-size: .88rem; }

    /* ---------- Details ---------- */
    details { margin-top: .9rem; }
    summary { width: fit-content; cursor: pointer; color: var(--muted); font-size: .76rem; }
    summary:hover { color: var(--ink); }
    .details-body { padding: .6rem 0 0; color: var(--ink-soft); font-size: .78rem; }
    .details-body p + p { margin-top: .3rem; }
    .definition-list { display: grid; gap: .55rem; margin: 0; }
    .definition-list dt { color: var(--ink); font-weight: 600; }
    .definition-list dd { margin: 0; }
    .kpi details { margin-top: .2rem; }

    .prose { display: grid; gap: .8rem; max-width: 46em; color: var(--ink-soft); font-size: .95rem; }
    .block + .block { margin-top: 1.5rem; }
    .source-note { margin-top: .6rem; color: var(--muted); font-size: .76rem; }

    footer { padding: 0 .5rem; color: var(--muted); font-size: .76rem; }

    /* ---------- Responsive ---------- */
    @media (max-width: 1080px) {
      .page { grid-template-columns: minmax(0, 1fr); }
      .toc { display: none; }
    }

    @media (max-width: 640px) {
      .page { padding: .75rem .75rem 3rem; }
      .report, main { gap: .75rem; }
      .cover, .section { padding: 1.4rem 1.15rem 1.6rem; }
      .cover h1 { margin-top: 2.25rem; }
      .brand-row { align-items: flex-start; flex-direction: column; }
      .path-row { grid-template-columns: minmax(0, 1fr) auto; }
      .path-row .bar, .path-note { grid-column: 1 / -1; }
      .path-row .bar { order: 3; }
      .path-note { order: 4; }
      .theme { grid-template-columns: minmax(0, 1fr); }
      .seg-row { grid-template-columns: minmax(0, 1fr) auto; }
      .seg-row .meter { grid-column: 1 / -1; order: 3; }
      .rec-header { grid-template-columns: auto minmax(0, 1fr); }
      .rec-pills { grid-column: 1 / -1; justify-content: flex-start; }
      .lesson-list { grid-template-columns: minmax(0, 1fr); }
    }

    /* ---------- Print ---------- */
    @media print {
      @page { size: A4; margin: 12mm; }

      html, html[data-theme="night"] {
        color-scheme: light;
        --canvas: #ffffff;
        --surface: #ffffff;
        --surface-2: #f7f6f2;
        --ink: #1c1a17;
        --ink-soft: #55514a;
        --muted: #6f6b62;
        --line: #dedad0;
        --line-strong: #bdb7a8;
        --good: #17703a;
        --watch: #8a5a00;
        --attention: #b3261e;
        --good-bg: #e8f4ec;
        --watch-bg: #fbf1dc;
        --attention-bg: #fbe9e7;
        --neutral-bg: #f0eee8;
        --shadow: none;
        font-size: 12.5px;
      }

      html[data-theme="night"] { --accent: #0f63ee; }

      html[data-theme="shifu"] .cover {
        border: 1px solid var(--line);
        border-top: 6px solid var(--accent);
        background: #ffffff;
        color: var(--ink);
      }

      html[data-theme="shifu"] .cover h1 { color: var(--ink); }
      html[data-theme="shifu"] .cover .brand-row,
      html[data-theme="shifu"] .cover .cover-subtitle,
      html[data-theme="shifu"] .cover .cover-meta,
      html[data-theme="shifu"] .cover .report-kind { color: var(--ink-soft); }
      html[data-theme="shifu"] .cover .cover-meta strong { color: var(--muted); }
      html[data-theme="shifu"] .cover .cover-meta { border-top-color: var(--line); }
      html[data-theme="shifu"] .cover .report-kind { border-color: var(--line-strong); }
      html .brand-logo.on-light { display: block !important; }
      html .brand-logo.on-dark { display: none !important; }
      html, body { background: #ffffff; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .skip-link, .toc { display: none; }
      .page { display: block; width: 100%; padding: 0; }
      .report, main { display: block; }
      .cover, .section { margin: 0 0 6mm; padding: 6mm 7mm; box-shadow: none; }
      .cover h1 { margin-top: 12mm; font-size: 2.4rem; }
      .section-heading { break-after: avoid-page; }
      .kpi, .conclusion, .path-row, .lesson, .rec, .note-card, .dimension, .theme, .callout,
      .metric-row, tr, .verdict { break-inside: avoid; }
      .lesson-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .table-wrap { overflow: visible; }
      details > summary { list-style: none; }
      details::details-content { content-visibility: visible; display: block; }
      details:not([open]) > .details-body { display: block; }
      footer { padding-top: 2mm; }
    }
{{CUSTOM_CSS}}
  </style>
</head>
<body>
  <a class="skip-link" href="#report-main">{{SKIP_TEXT}}</a>
  <div class="page">
    <nav class="toc" aria-label="{{TOC_LABEL}}">{{REPORT_TOC}}</nav>
    <div class="report">
      <header class="cover" aria-labelledby="report-title">
        <div class="brand-row">
          <div class="brand-lockup">
            {{BRAND_LOGO}}{{ORGANIZATION_NAME}}
          </div>
          <span class="report-kind">{{TITLE_SUFFIX}}</span>
        </div>
        <h1 id="report-title">{{COURSE_TITLE}}</h1>
        <p class="cover-subtitle">{{REPORT_SUBTITLE}}</p>
        <div class="cover-meta" aria-label="{{META_LABEL}}">{{REPORT_META}}</div>
      </header>

      <main id="report-main">{{REPORT_BODY}}</main>

      <footer>{{FOOTER_TEXT}}</footer>
    </div>
  </div>
</body>
</html>
