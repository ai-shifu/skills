name: Release Skills

on:
  push:
    tags:
      - "skills-v*"
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Skill version to preview (X.Y.Z); no Release is created"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: skill-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install "requests>=2.28" "python-dotenv>=1.0"

      - name: Validate skills and run tests
        run: |
          python3 scripts/validate_skill_quality.py
          python3 -m unittest discover -s tests -p "test_*.py"
          cd tools/ai-shifu-skill-release
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify selected commit
        env:
          AISHIFU_PUBLISHER_NAME: ${{ vars.AISHIFU_PUBLISHER_NAME }}
          AISHIFU_PUBLISHER_EMAIL: ${{ vars.AISHIFU_PUBLISHER_EMAIL }}
          PREVIEW_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 tools/ai-shifu-skill-release/scripts/release.py build \
            --source-ref "$GITHUB_SHA" --expected-version "$PREVIEW_VERSION" --output dist
          release_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$release_dir"
          python3 tools/ai-shifu-skill-release/scripts/release.py verify "$release_dir"
          python3 tools/ai-shifu-skill-release/scripts/github_release.py "$release_dir" \
            --tag "skills-v$PREVIEW_VERSION" --commit "$GITHUB_SHA" \
            --prepare-only --output preview-assets

      - name: Save preview attachments
        uses: actions/upload-artifact@v4
        with:
          name: skill-release-preview-${{ github.sha }}
          path: preview-assets/*
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install "requests>=2.28" "python-dotenv>=1.0"

      - name: Validate skills and run tests
        run: |
          python3 scripts/validate_skill_quality.py
          python3 -m unittest discover -s tests -p "test_*.py"
          cd tools/ai-shifu-skill-release
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify tagged commit
        env:
          AISHIFU_PUBLISHER_NAME: ${{ vars.AISHIFU_PUBLISHER_NAME }}
          AISHIFU_PUBLISHER_EMAIL: ${{ vars.AISHIFU_PUBLISHER_EMAIL }}
        run: |
          version="${GITHUB_REF_NAME#skills-v}"
          python3 tools/ai-shifu-skill-release/scripts/release.py build \
            --source-ref "$GITHUB_SHA" --expected-version "$version" --output dist
          release_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$release_dir"
          python3 tools/ai-shifu-skill-release/scripts/release.py verify "$release_dir"

      - name: Publish complete GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python3 tools/ai-shifu-skill-release/scripts/github_release.py "$release_dir" \
            --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"

  publish-clawhub:
    needs: publish
    if: github.event_name == 'push'
    uses: ./.github/workflows/platform-publish.yml
    with:
      tag: ${{ github.ref_name }}
      target: clawhub
    secrets:
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

  publish-skillhub:
    needs: publish
    if: github.event_name == 'push'
    uses: ./.github/workflows/platform-publish.yml
    with:
      tag: ${{ github.ref_name }}
      target: skillhub
    secrets:
      SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
