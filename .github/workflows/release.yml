name: Release Skills

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Skill version to preview, prepare, or retry publishing (X.Y.Z)"
        required: true
        type: string
      preview_type:
        description: "Preview artifacts, prepare a draft, or retry publishing the original merged commit"
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - draft
          - publish
      source_commit:
        description: "For publish recovery: full original merged source SHA (required for publish)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: skill-release-${{ (github.event_name == 'push' && github.ref_type == 'branch' && github.sha) || github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && format('v{0}', inputs.expected_version)) || github.ref_name }}
  cancel-in-progress: false

jobs:
  release_source:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.preview_type != 'artifact')
    runs-on: ubuntu-24.04
    outputs:
      create_draft: ${{ steps.source.outputs.create_draft }}
      publish_release: ${{ steps.source.outputs.publish_release }}
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect a version increase on main
        id: source
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PREVIEW_TYPE: ${{ inputs.preview_type }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PYTHONPATH: tools/ai-shifu-skill-release/scripts
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path
          from ai_shifu_release.github_releases import TAG_PATTERN
          from ai_shifu_release.skill_metadata import parse_frontmatter, split_skill_document

          event = os.environ['GITHUB_EVENT_NAME']
          ref_type = os.environ['GITHUB_REF_TYPE']
          ref_name = os.environ['GITHUB_REF_NAME']
          mode = os.environ['PREVIEW_TYPE']
          commit = os.environ['GITHUB_SHA']
          if event == 'workflow_dispatch':
              if ref_type != 'branch' or ref_name != 'main':
                  raise ValueError('Formal Release recovery requires the main branch')
              if mode == 'publish':
                  commit = os.environ['SOURCE_COMMIT']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise ValueError('A full source commit is required')

          def version_at(revision):
              text = subprocess.run(
                  ['git', 'show', f'{revision}:skills/ai-shifu-course-creator/SKILL.md'],
                  check=True, capture_output=True, text=True,
              ).stdout
              frontmatter, _ = split_skill_document(text, revision)
              version = parse_frontmatter(frontmatter).get('version', '')
              if not TAG_PATTERN.fullmatch('v' + version):
                  raise ValueError(f'Invalid formal release version: {version!r}')
              return version

          version = version_at(commit)
          create_draft = True
          publish_release = False
          if event == 'push' and ref_type == 'branch':
              if ref_name != 'main':
                  raise ValueError('Automatic releases require main')
              before = os.environ['PUSH_BEFORE']
              if before == '0' * 40:
                  create_draft = False
                  print('Initial main push has no prior version; skipping automatic release')
              else:
                  if not re.fullmatch(r'[0-9a-f]{40}', before):
                      raise ValueError('A previous main commit is required')
                  subprocess.run(['git', 'merge-base', '--is-ancestor', before, commit], check=True)
                  previous = version_at(before)
                  if version == previous:
                      create_draft = False
                      print('Skill version is unchanged; skipping automatic release')
                  elif tuple(map(int, version.split('.'))) <= tuple(map(int, previous.split('.'))):
                      raise ValueError('The release version must increase')
              publish_release = create_draft
          elif event == 'push' and ref_type == 'tag':
              if ref_name != 'v' + version:
                  raise ValueError('Tag and source version differ')
          elif event == 'workflow_dispatch':
              if mode not in ('draft', 'publish'):
                  raise ValueError('Unsupported formal Release mode')
              if os.environ['EXPECTED_VERSION'] != version:
                  raise ValueError('Expected version and source version differ')
              publish_release = mode == 'publish'
          else:
              raise ValueError('Unsupported draft source event')

          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'create_draft={str(create_draft).lower()}\n')
              output.write(f'publish_release={str(publish_release).lower()}\n')
              output.write(f'version={version}\ntag=v{version}\ncommit={commit}\n')
          PY

  preview:
    if: github.event_name == 'workflow_dispatch' && inputs.preview_type == 'artifact'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install "requests>=2.28" "python-dotenv>=1.0"

      - name: Validate skills and run tests
        run: |
          python3 scripts/validate_skill_quality.py
          python3 -m unittest discover -s tests -p "test_*.py"
          cd tools/ai-shifu-skill-release
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify selected commit
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_VERSION: ${{ inputs.expected_version }}
        run: |
          python3 tools/ai-shifu-skill-release/scripts/release.py build \
            --source-ref "$GITHUB_SHA" --expected-version "$PREVIEW_VERSION" --output dist
          release_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$release_dir"
          python3 tools/ai-shifu-skill-release/scripts/release.py verify "$release_dir"
          python3 tools/ai-shifu-skill-release/scripts/release.py github-release "$release_dir" \
            --tag "v$PREVIEW_VERSION" --commit "$GITHUB_SHA" \
            --prepare-only --preview --output preview-assets
          cat preview-assets/notes/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save preview attachments
        uses: actions/upload-artifact@v4
        with:
          name: skill-release-preview-${{ github.sha }}
          path: |
            preview-assets/*.zip
            preview-assets/release.json
            preview-assets/SHA256SUMS
          retention-days: 7

      - name: Save preview release notes
        uses: actions/upload-artifact@v4
        with:
          name: skill-release-notes-preview-${{ github.sha }}
          path: preview-assets/notes/
          retention-days: 7

  draft:
    name: Build, verify and prepare or publish Release
    needs: release_source
    if: needs.release_source.outputs.create_draft == 'true'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      published: ${{ steps.publication.outputs.published }}
      tag: ${{ needs.release_source.outputs.tag }}
    concurrency:
      group: skill-release-draft-${{ needs.release_source.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Require main after the version PR is merged
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" = main

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_source.outputs.commit }}
          fetch-depth: 0

      - name: Ensure Draft Release source is on main
        env:
          RELEASE_COMMIT: ${{ needs.release_source.outputs.commit }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install "requests>=2.28" "python-dotenv>=1.0"

      - name: Validate skills and run tests
        run: |
          python3 scripts/validate_skill_quality.py
          python3 -m unittest discover -s tests -p "test_*.py"
          cd tools/ai-shifu-skill-release
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p "test_*.py"

      - name: Build and verify selected commit
        env:
          RELEASE_VERSION: ${{ needs.release_source.outputs.version }}
          RELEASE_COMMIT: ${{ needs.release_source.outputs.commit }}
        run: |
          python3 tools/ai-shifu-skill-release/scripts/release.py build \
            --source-ref "$RELEASE_COMMIT" --expected-version "$RELEASE_VERSION" --output dist
          release_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$release_dir"
          python3 tools/ai-shifu-skill-release/scripts/release.py verify "$release_dir"

      - name: Pin the formal version tag to the verified source
        env:
          RELEASE_TAG: ${{ needs.release_source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release_source.outputs.commit }}
        run: |
          git check-ref-format "refs/tags/$RELEASE_TAG"
          if git ls-remote --exit-code --refs origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$RELEASE_COMMIT"
          else
            status=$?
            if test "$status" -ne 2; then
              exit "$status"
            fi
            git push origin "$RELEASE_COMMIT:refs/tags/$RELEASE_TAG"
          fi

      - name: Upload, verify and publish the formal Release
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.release_source.outputs.commit }}
          PUBLISH_RELEASE: ${{ needs.release_source.outputs.publish_release }}
        run: |
          release_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          options=()
          if test "$PUBLISH_RELEASE" != true; then
            options+=(--draft-only)
          fi
          python3 tools/ai-shifu-skill-release/scripts/release.py github-release "$release_dir" \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" "${options[@]}" --notes-output release-notes \
            | tee release-url.txt
          echo "published=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Release: $(cat release-url.txt)" >> "$GITHUB_STEP_SUMMARY"
          cat release-notes/release-notes.md >> "$GITHUB_STEP_SUMMARY"
          if test "$PUBLISH_RELEASE" = true; then
            echo 'The formal Release and all six attachments have been verified.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Draft-only mode: this Release is still unpublished.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save Release notes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-release-notes-${{ needs.release_source.outputs.commit }}-${{ github.run_attempt }}
          path: release-notes/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report Release recovery steps
        if: failure()
        env:
          RELEASE_COMMIT: ${{ needs.release_source.outputs.commit }}
          RELEASE_VERSION: ${{ needs.release_source.outputs.version }}
        run: |
          echo "::error::Release failed for $RELEASE_COMMIT. Re-run the failed jobs to retry the same source."
          {
            echo "Release recovery source: $RELEASE_COMMIT (version $RELEASE_VERSION)."
            echo 'Re-run the failed jobs, or run Release Skills on main with preview_type=publish, the same expected_version, and source_commit set to this SHA.'
            echo 'Existing attachments must match; published Releases are verified without changes.'
            echo 'After GitHub Release recovery, inspect channel state and retry channels separately through Publish Skill Channel.'
          } >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN publication does not trigger release.published workflows.
  # Run initial submissions here; recover channels through Publish Skill Channel.
  publish-clawhub:
    needs: draft
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref_type == 'branch' && github.run_attempt == 1 && needs.draft.result == 'success' && needs.draft.outputs.published == 'true') ||
       (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')))
    uses: ./.github/workflows/platform-publish.yml
    with:
      tag: ${{ needs.draft.outputs.tag || github.event.release.tag_name }}
      target: clawhub
    secrets:
      CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}

  publish-skillhub:
    needs: draft
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' && github.ref_type == 'branch' && github.run_attempt == 1 && needs.draft.result == 'success' && needs.draft.outputs.published == 'true') ||
       (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')))
    uses: ./.github/workflows/platform-publish.yml
    with:
      tag: ${{ needs.draft.outputs.tag || github.event.release.tag_name }}
      target: skillhub
    secrets:
      SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
