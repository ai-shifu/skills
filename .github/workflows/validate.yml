name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  cli:
    name: Validate CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup CLI Python runtime
        id: cli-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CLI dependencies without running setup
        run: npm ci --ignore-scripts

      - name: Install configuration migration test dependency
        run: python -m pip install "python-dotenv>=1.0"

      - name: Check CLI and Skill versions
        run: npm run check-version

      - name: Test CLI installation and Skill synchronization
        env:
          AI_SHIFU_PYTHON: ${{ steps.cli-python.outputs.python-path }}
        run: npm test

      - name: Verify real npm installation and automatic Skill setup
        timeout-minutes: 10
        env:
          AI_SHIFU_PYTHON: ${{ steps.cli-python.outputs.python-path }}
        run: npm run test:install

      - name: Create CLI package directory
        run: node -e "require('node:fs').mkdirSync('cli-artifacts', {recursive:true})"

      - name: Pack the CLI with bundled Skills
        run: npm pack --pack-destination cli-artifacts

      - name: Save installable CLI package
        uses: actions/upload-artifact@v4
        with:
          name: cli-package-${{ matrix.os }}-${{ github.sha }}
          path: cli-artifacts/*.tgz
          retention-days: 7
          if-no-files-found: error

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install "requests>=2.28" "python-dotenv>=1.0"

      - name: Validate skill quality
        run: python3 scripts/validate_skill_quality.py

      - name: Run skill tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run release tool tests
        working-directory: tools/ai-shifu-skill-release
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests -p "test_*.py"

      - name: Trial build from PR commit
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ai-shifu-skill-release/scripts/release.py build \
            --source-repo-url "$GITHUB_WORKSPACE" --source-ref "$GITHUB_SHA" --output dist
          release_dir="$(find dist -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$release_dir"
          python3 tools/ai-shifu-skill-release/scripts/release.py verify "$release_dir"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["skill"]["version"])' "$release_dir/release.json")"
          python3 tools/ai-shifu-skill-release/scripts/release.py github-release "$release_dir" \
            --tag "v$version" --commit "$GITHUB_SHA" \
            --prepare-only --preview --github-repo "$GITHUB_REPOSITORY" --output preview-assets
          cat preview-assets/notes/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save PR trial packages
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: skill-preview-pr-${{ github.event.pull_request.number }}
          path: |
            preview-assets/*.zip
            preview-assets/release.json
            preview-assets/SHA256SUMS
          retention-days: 7

      - name: Save PR trial release notes
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: skill-release-notes-pr-${{ github.event.pull_request.number }}
          path: preview-assets/notes/
          retention-days: 7

  profile-concurrency-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install profile test dependency
        run: python -m pip install "python-dotenv>=1.0" "requests>=2.28"

      - name: Test native Windows profile locking
        run: python -m unittest discover -s tests -p "test_profile_concurrency.py"

      - name: Test Windows login guidance
        run: python -m unittest discover -s tests -p "test_profile_login_hints.py"

      - name: Test native Windows update checks
        run: python -m unittest discover -s tests -p "test_skill_update_check.py"
