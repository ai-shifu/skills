name: Validate Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python3 -m pip install "requests>=2.28" "python-dotenv>=1.0"

      - name: Validate skill quality
        run: python3 scripts/validate_skill_quality.py

      - name: Run skill tests
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Run release tool tests
        working-directory: tools/ai-shifu-skill-release
        run: python3 -m unittest discover -s tests -p "test_*.py"
